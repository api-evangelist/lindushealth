aid: lindushealth
name: Lindus Health
description: >-
  Lindus (Lindus Health) is a next-generation contract research organization (CRO) that runs
  end-to-end clinical trials for biotech and pharma sponsors on performance-based contracts, with
  one integrated team accountable from protocol design through database lock. Its Citrus™
  AI-assisted trial operating system unifies EDC, eSource, ePRO/eCOA, eConsent, participant
  pre-screening, CTMS and real-time operational monitoring in a single platform, and its
  centralized enrollment infrastructure uses AI-powered querying across a 40M+ record EHR database
  plus digital pre-screening to find and enroll patients inside real-world care pathways. Delivery
  runs site-based, hybrid or fully decentralized across a network of 1,000+ sites, with therapeutic
  depth in cardiometabolic, respiratory, psychiatry, women's health, dermatology and diagnostics.
  Founded by co-CEOs Meri Beckwith and Michael Young. Lindus publishes no public developer API;
  Citrus is a customer platform for sponsors and sites. Its public technical surface is two GitHub
  repositories covering CDISC SDTM export and CDISC conformance rules.
